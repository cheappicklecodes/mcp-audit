name: test

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: a clean server passes
        run: node bin/mcp-audit.js test/fixtures/good-server --fail-on high
      - name: a bad server trips the gate
        run: |
          set +e
          node bin/mcp-audit.js test/fixtures/bad-server --fail-on critical
          code=$?
          echo "exit=$code"
          test "$code" -eq 1
      - name: benchmark corpus
        run: node benchmark/bench.mjs
      - name: audit self
        run: node bin/mcp-audit.js . --format sarif > audit.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: matrix.node == 22
        with:
          sarif_file: audit.sarif

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/mcp-audit.js . --check
